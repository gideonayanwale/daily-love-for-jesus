name: CI/CD Pipeline & Deployment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false

jobs:
  # ─── Job 1: Code Quality & Type Integrity ──────────────────────────────────
  quality-check:
    name: Type Integrity, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Setup Node.js 24
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        id: install-app
        run: npm --prefix app install --legacy-peer-deps

      - name: TypeScript Type-Check
        run: npm --prefix app run check

      - name: Focused lint for changed devotional UI
        run: npm --prefix app run lint:ui

      - name: Run Test Suites
        if: always() && steps['install-app'].outcome == 'success'
        run: npm --prefix app run test -- --run

  # ─── Job 2: Monorepo Build Verification ────────────────────────────────────
  build-production:
    name: Build Production Bundles
    needs: quality-check
    if: always() && needs['quality-check'].result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        run: npm --prefix app install --legacy-peer-deps

      - name: Install Backend Dependencies
        run: npm --prefix backend install --legacy-peer-deps

      - name: Report dependency vulnerability audit
        continue-on-error: true
        run: |
          for package in app backend; do
            report="$(mktemp)"
            npm --prefix "$package" audit --json > "$report" || true
            node -e 'const fs=require("node:fs"); const [file, packageName]=process.argv.slice(1); try { const report=JSON.parse(fs.readFileSync(file,"utf8")); const totals=report.metadata?.vulnerabilities ?? {}; console.log(`[${packageName}] vulnerability totals:`, totals); for (const [name,item] of Object.entries(report.vulnerabilities ?? {})) console.log(`[${packageName}] ${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`); } catch { console.log(`[${packageName}] npm audit did not return parseable JSON.`); }' "$report" "$package"
            rm -f "$report"
          done
      - name: Build Frontend SPA & Backend API
        env:
          NODE_ENV: production
          APP_SECRET: ${{secrets.APP_SECRET || 'ci-build-placeholder-not-used-at-runtime'}}
          VITE_SUPABASE_URL: ${{secrets.VITE_SUPABASE_URL || 'https://mock.supabase.co'}}
          VITE_SUPABASE_ANON_KEY: ${{secrets.VITE_SUPABASE_ANON_KEY || 'mock-anon-key'}}
        run: |
          npm --prefix app run build
          npm --prefix backend run build

      - name: Verify Build Artifacts
        run: |
          test -d app/dist/public || { echo "Frontend output missing at app/dist/public"; exit 1; }
          test -f app/dist/public/index.html || { echo "Frontend index.html missing"; exit 1; }
          test -f backend/dist/main.js || { echo "NestJS backend output missing at backend/dist/main.js"; exit 1; }
          echo "Frontend SPA and NestJS backend compiled successfully."

  # ─── Job 3: Multi-Stage Container Build ─────────────────────────────────────
  docker-build:
    name: Docker Image Build & Validation
    needs: quality-check
    if: always() && needs.quality-check.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Full-Stack Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: daily-love-for-jesus:latest

  # ─── Job 4: Automated Deploy Trigger (Main branch only) ──────────────────────
  deploy-trigger:
    name: Trigger Production Deployments
    needs: [quality-check, build-production, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs['quality-check'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway Deploy Webhook (if configured)
        if: ${{env.RAILWAY_DEPLOY_WEBHOOK != ''}}
        env:
          RAILWAY_DEPLOY_WEBHOOK: ${{secrets.RAILWAY_DEPLOY_WEBHOOK}}
        run: |
          curl -X POST -s -S -f "$RAILWAY_DEPLOY_WEBHOOK" || echo "Railway deploy webhook trigger skipped or failed"

      - name: Trigger Render Deploy Webhook (if configured)
        if: ${{env.RENDER_DEPLOY_WEBHOOK != ''}}
        env:
          RENDER_DEPLOY_WEBHOOK: ${{secrets.RENDER_DEPLOY_WEBHOOK}}
        run: |
          curl -X POST -s -S -f "$RENDER_DEPLOY_WEBHOOK" || echo "Render deploy webhook trigger skipped or failed"

      - name: Deployment Instructions Summary
        run: |
          echo "CI verification complete."
          echo "Cloudflare Pages, Netlify, and Vercel automatically deploy from Git commits to main."
