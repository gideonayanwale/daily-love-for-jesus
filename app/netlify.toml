# ==============================================================================
# Netlify Configuration for Daily Love For Jesus (app directory)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "24.21.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hono API Serverless Function routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application (SPA) client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term immutable caching for hashed production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure HTML index is revalidated
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
