services:
  - type: web
    name: daily-love-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm --prefix backend install --legacy-peer-deps && npm --prefix backend run build
    startCommand: npm --prefix backend run start:prod
    healthCheckPath: /api/sync/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: 24.21.0
      - key: FRONTEND_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ID
        value: daily-love-app
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
